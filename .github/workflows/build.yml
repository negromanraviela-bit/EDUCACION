name: Crear APK
"on": [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir ZIP
        run: |
          echo "Buscando ZIP..."
          find . -type f -name "*.zip"
          ZIP=$(find . -type f -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP"
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d .
          fi
          ls -R | head -n 200

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear APK
        run: |
          echo "Buscando gradlew..."
          find . -type f -name "gradlew"
          F=$(find . -type f -name "gradlew" | head -n 1)
          echo "Encontrado: $F"
          if [ -z "$F" ]; then
            echo "NO se encontro gradlew, mostrando carpetas:"
            ls -la
            find . -type d | head -n 50
            exit 1
          fi
          R=$(dirname "$F")
          chmod +x "$F"
          cd "$R"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Educacion-Fisica
          path: "**/build/outputs/apk/debug/*.apk"
